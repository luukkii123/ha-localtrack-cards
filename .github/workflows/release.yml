name: Release

# Ein Tag-Push genügt. Dieser Workflow legt das Release selbst an und hängt die
# fertige JS-Datei als Asset dran — vorher musste das Release von Hand im
# Browser erzeugt werden, sonst zeigte HACS kein Update.
#
# HACS nimmt bevorzugt das Asset; ohne Asset fällt es auf die Datei im Repo
# (dist/localtrack-cards.js) zurück.
on:
  push:
    tags:
      - "v*"
  # Nachträglich auslösbar, falls ein Tag schon existiert.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/validate.yml

  release:
    name: Release anlegen
    needs: tests
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Version gegen den Tag prüfen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          card=$(grep -oP 'CARD_VERSION = "\K[^"]+' dist/localtrack-cards.js)
          echo "Tag: $tag — CARD_VERSION: $card"
          if [ "$tag" != "$card" ]; then
            echo "::error::CARD_VERSION ($card) passt nicht zum Tag ($tag)."
            exit 1
          fi

      - name: SHA-256 checksum
        run: cd dist && sha256sum localtrack-cards.js > localtrack-cards.js.sha256 && cat localtrack-cards.js.sha256

      - name: Release anlegen und Asset anhängen
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/localtrack-cards.js
            dist/localtrack-cards.js.sha256

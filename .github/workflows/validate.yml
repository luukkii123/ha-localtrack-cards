name: Validate

# Generated from hacs/scripts/ci-vorlage/validate.yml (M45); only the bundle name differs per repo.
# Change the template and copy it to all five card repos; scripts/ci-vorlage-pruefen.py checks that.

on:
  workflow_call:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: plugin

  node:
    name: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Syntax
        run: for f in dist/*.js; do node --check "$f"; done
      - name: Shared blocks match their hash
        run: |
          python3 - <<'PY'
          import hashlib,pathlib,re,sys
          bad=False
          for p in sorted(pathlib.Path('dist').glob('*.js')):
            text=p.read_text();names=re.findall(r'/\* BEGIN BUSCH SHARED (\w+) ',text)
            if not names: print(p,'kein Shared-Block');continue
            for n in sorted(set(names)):
              blocks=re.findall(r'/\* BEGIN BUSCH SHARED '+n+r' (\S+) sha256:([0-9a-f]{64}) \*/\n(.*?)/\* END BUSCH SHARED '+n+r' \*/',text,re.S)
              ok=len(blocks)==1==names.count(n)==text.count('/* END BUSCH SHARED '+n+' */')
              if ok:
                ver,digest,body=blocks[0]
                # Optional generated first line: const BUSCH_<NAME>_STAMP with version and hash prefix.
                stamp=re.match(r'const BUSCH_'+n+r'_STAMP = Object\.freeze\(\{ version: "([^"]+)", sourceHash: "([0-9a-f]{12})" \}\);\n',body)
                if stamp: ok=stamp[1]==ver and stamp[2]==digest[:12];body=body[stamp.end():]
                ok=ok and hashlib.sha256(body.encode()).hexdigest()==digest
              print(p,n,'ok' if ok else 'ABWEICHUNG');bad|=not ok
          sys.exit(1 if bad else 0)
          PY
      - name: Testkit matches its hash
        run: |
          python3 - <<'PY'
          # tests/_testkit.cjs is a whole-file copy of hacs shared-ui/testkit.cjs (M5): one header line
          # with version and sha256 of the rest, written by scripts/sync-shared-ui.py. A local edit fails here.
          import hashlib,pathlib,re,sys
          p=pathlib.Path('tests/_testkit.cjs')
          if not p.exists(): print(p,'fehlt');sys.exit(1)
          head,_,body=p.read_text(encoding='utf-8').partition('\n')
          m=re.fullmatch(r'// BUSCH SHARED TESTKIT (\S+) sha256:([0-9a-f]{64}) generated from shared-ui/testkit\.cjs by scripts/sync-shared-ui\.py; edit the source, not this copy',head)
          v=re.search(r"const TESTKIT_VERSION = '([^']+)'",body)
          ok=bool(m and v) and v[1]==m[1] and hashlib.sha256(body.encode()).hexdigest()==m[2]
          print(p,'TESTKIT',m[1] if m else '-','ok' if ok else 'ABWEICHUNG');sys.exit(0 if ok else 1)
          PY
      - name: Sinks
        run: |
          python3 - dist/*.js <<'PY'
          #!/usr/bin/env python3
          # Sinks (M19, S5.5): report every innerHTML/outerHTML assignment and insertAdjacentHTML call
          # whose expression (up to the end of the statement, also across lines) interpolates `${`
          # without an escape helper and without `// sink-ok: <reason>` on the same or the previous line.
          # Arguments: bundle files (default dist/*.js). Vendor blocks are upstream code and skipped.
          # Exit 1 with file:line per finding. Standard library only; the body also runs as a heredoc.
          import glob, re, sys

          ESCAPES = ('escapeHtml(', 'calEscape(')
          SINK = re.compile(r'\.(?:inner|outer)HTML\s*\+?=(?!=)|\.insertAdjacentHTML\s*\(')
          MARK = re.compile(r'//\s*sink-ok:\s*\S')
          VENDOR = re.compile(r'/\* BEGIN VENDOR .*?/\* END VENDOR [^\n]*?\*/', re.S)
          REGEX_BEFORE = set('(,=:[!&|?{};+-*%<>~^') | {''}
          KEYWORD = re.compile(r'(?<![\w$.])(?:return|typeof|case|in|of|else|do|yield|await|void|delete|instanceof|new)\s*$')
          CONTINUES_BEFORE = set('+-*/%=&|?:,(<>!~^[{.')
          CONTINUES_AFTER = set('+-*/%&|?:.,=<>')


          class Scan:
              def __init__(self, text):
                  self.s, self.found = text, []

              def string(self, i, quote):
                  s = self.s
                  while i < len(s) and s[i] != quote:
                      i += 2 if s[i] == '\\' else 1
                  return i + 1

              def template(self, i):
                  s = self.s
                  while i < len(s):
                      if s[i] == '\\':
                          i += 2
                      elif s[i] == '`':
                          return i + 1
                      elif s.startswith('${', i):
                          i = self.code(i + 2, '}')
                      else:
                          i += 1
                  return i

              def regex(self, i):
                  s, klass = self.s, False
                  while i < len(s) and s[i] != '\n':
                      c = s[i]
                      if c == '\\':
                          i += 2
                          continue
                      if c == '[':
                          klass = True
                      elif c == ']':
                          klass = False
                      elif c == '/' and not klass:
                          return i + 1
                      i += 1
                  return i

              def code(self, i, close=None, stop_at_statement=False):
                  """Scans code from i; returns the index after `close` (or the statement end)."""
                  s, depth, prev = self.s, 0, ''
                  while i < len(s):
                      c = s[i]
                      if c in ' \t\r':
                          i += 1
                          continue
                      if c == '\n':
                          if stop_at_statement and depth == 0 and prev and prev not in CONTINUES_BEFORE:
                              j = i
                              while j < len(s) and s[j] in ' \t\r\n':
                                  j += 1
                              if j >= len(s) or (s[j] not in CONTINUES_AFTER and not s.startswith('//', j) and not s.startswith('/*', j)):
                                  return i
                          i += 1
                          continue
                      if s.startswith('//', i):
                          i = s.find('\n', i)
                          i = len(s) if i < 0 else i
                          continue
                      if s.startswith('/*', i):
                          i = s.find('*/', i + 2)
                          i = len(s) if i < 0 else i + 2
                          continue
                      if c in '\'"':
                          i, prev = self.string(i + 1, c), c
                          continue
                      if c == '`':
                          i, prev = self.template(i + 1), c
                          continue
                      if c == '/' and (prev in REGEX_BEFORE or (prev.isalnum() and KEYWORD.search(s, max(0, i - 30), i))):
                          i, prev = self.regex(i + 1), '/'
                          continue
                      if not stop_at_statement:
                          m = SINK.match(s, i)
                          if m:
                              self.sink(i, m)
                      if c in '([{':
                          depth += 1
                      elif c in ')]}':
                          if depth == 0:
                              return i if stop_at_statement else i + 1
                          depth -= 1
                      elif stop_at_statement and depth == 0 and c in ';,':
                          return i
                      prev = c
                      i += 1
                  return i

              def sink(self, i, m):
                  start = m.end()
                  if m.group().endswith('('):
                      end = self.code(start, ')')
                  else:
                      end = self.code(start, stop_at_statement=True)
                  expr = self.s[start:end]
                  if '${' in expr and not any(e in expr for e in ESCAPES):
                      self.found.append(self.s.count('\n', 0, i) + 1)


          def findings(text):
              text = VENDOR.sub(lambda m: re.sub(r'[^\n]', ' ', m.group()), text)
              scan, i = Scan(text), 0
              while i < len(text):
                  i = scan.code(i)
              lines = text.split('\n')
              marked = lambda n: MARK.search(lines[n - 1]) or (n > 1 and MARK.search(lines[n - 2]))
              # M47 (24.11.2026): no inline onerror outside the vendor block (handlers via addEventListener).
              inline = {text.count('\n', 0, m.start()) + 1 for m in re.finditer(r'onerror\s*=', text)}
              return sorted(n for n in set(scan.found) | inline if not marked(n))


          def main(argv):
              files = argv or sorted(glob.glob('dist/*.js'))
              if not files:
                  print('Sinks: no bundle given')
                  return 1
              bad = 0
              for path in files:
                  for line in findings(open(path, encoding='utf-8').read()):
                      print(f'{path}:{line}: HTML sink interpolates a template expression without escape helper or // sink-ok: <reason>')
                      bad += 1
              print(f'Sinks: {bad} finding(s) in {len(files)} file(s)' if bad else f'Sinks: ok ({len(files)} file(s))')
              return 1 if bad else 0


          sys.exit(main(sys.argv[1:]))
          PY
      - name: Vendor blocks match their hash
        run: |
          python3 - <<'PY'
          # sha256 over the bytes between the BEGIN line and the END line, i.e. upstream as embedded.
          # A repo without vendor code has no marker at all; its presence is a node test where it exists.
          import hashlib,pathlib,re,sys
          bad=False;found=0
          for p in sorted(pathlib.Path('dist').glob('*.js')):
            text=p.read_bytes()
            blocks=re.findall(rb'/\* BEGIN VENDOR ([\w.-]+) (\S+) sha256:([0-9a-f]{64}) \*/\n(.*?)^/\* END VENDOR \1 \*/',text,re.S|re.M)
            if not len(blocks)==text.count(b'/* BEGIN VENDOR ')==text.count(b'/* END VENDOR '): print(p,'vendor marker ABWEICHUNG');bad=True
            for name,ver,digest,body in blocks:
              found+=1;ok=hashlib.sha256(body).hexdigest()==digest.decode()
              print('vendor',name.decode(),'ok' if ok else 'ABWEICHUNG '+ver.decode()+' '+str(p));bad|=not ok
          if not found: print('vendor: kein Block in diesem Repo')
          sys.exit(1 if bad else 0)
          PY
      - name: Tests
        run: if ls tests/*.test.js >/dev/null 2>&1; then node --test tests/*.test.js; else echo "no tests"; fi

  contracts:
    # Browser contracts (D12): only the repo's own render scripts listed in .github/ci-contracts.txt, which
    # need neither private data nor network. Same Playwright as hacs/scripts/karten-runner.json; the scripts
    # run with --network none, so a script that reaches out fails instead of silently passing.
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright/python:v1.62.0-noble
      PLAYWRIGHT_PIP: playwright==1.62.0
      BUNDLE: dist/localtrack-cards.js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Playwright
        # Same install as hacs/scripts/karten-alle.sh, then frozen into a local image for the offline run.
        run: |
          docker pull "$PLAYWRIGHT_IMAGE"
          docker run --name ci-playwright "$PLAYWRIGHT_IMAGE" \
            python3 -m pip install --quiet --no-cache-dir --break-system-packages "$PLAYWRIGHT_PIP"
          docker commit ci-playwright ci-playwright:pinned
          docker rm ci-playwright
      - name: Contracts without network
        run: |
          docker run --rm -i --network none -v "$GITHUB_WORKSPACE:/w" -e BUNDLE -w /w ci-playwright:pinned bash -s <<'SH'
          set -u
          fail=0; n=0
          while read -r script args; do
            case "$script" in ''|'#'*) continue ;; esac
            n=$((n + 1)); out="/w/.ci-out/$n"; mkdir -p "$out"
            args="${args//\{bundle\}/$BUNDLE}"; args="${args//\{out\}/$out}"
            echo "::group::$script $args"
            if timeout 600 python3 "$script" $args </dev/null; then echo "ok: $script"; else echo "::error::contract failed: $script"; fail=1; fi
            echo "::endgroup::"
          done < .github/ci-contracts.txt
          if [ "$n" -eq 0 ]; then echo "::error::.github/ci-contracts.txt lists no contract"; exit 1; fi
          exit "$fail"
          SH
